name: Ecommerce Data Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: '要运行的命令 (full/pipeline/cpi)'
        required: true
        default: 'pipeline'
        type: choice
        options:
          - full
          - pipeline
          - cpi

jobs:
  run-pipeline:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 写入 config.ini（从 GitHub Secrets）
        run: |
          mkdir -p env
          echo "${{ secrets.CONFIG_INI }}" > env/config.ini

      - name: 测试连接
        run: python run.py test

      - name: 运行指定命令
        run: |
          case "${{ github.event.inputs.command }}" in
            pipeline) python run.py pipeline --start 2020-01-01 --end 2024-12-31 ;;
            cpi) python run.py cpi --start 2020-01-01 --end 2024-12-31 --force ;;
            *) python run.py full --start 2020-01-01 --end 2024-12-31 ;;
          esac
