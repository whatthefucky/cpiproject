name: Ecommerce Data Pipeline

on:
  workflow_dispatch:
    inputs:
      command:
        description: '要运行的命令 (full/pipeline/cpi)'
        required: true
        default: 'pipeline'
        type: choice
        options:
          - full
          - pipeline
          - cpi

jobs:
  run-pipeline:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: cmd

      - name: 写入 config.ini（从 GitHub Secrets）
        run: |
          import os
          os.makedirs('env', exist_ok=True)
          with open('env/config.ini', 'w', encoding='utf-8') as f:
              f.write(os.environ['CONFIG_INI'])
        shell: python
        env:
          CONFIG_INI: ${{ secrets.CONFIG_INI }}

      - name: 测试连接
        run: python run.py test
        shell: cmd

      - name: 运行指定命令
        run: |
          import os
          cmd = os.environ.get('INPUT_COMMAND', 'full')
          start = os.environ.get('START_DATE', '2020-01-01')
          end = os.environ.get('END_DATE', '2024-12-31')
          if cmd == 'pipeline':
              os.system(f'python run.py pipeline --start {start} --end {end}')
          elif cmd == 'cpi':
              os.system(f'python run.py cpi --start {start} --end {end} --force')
          else:
              os.system(f'python run.py full --start {start} --end {end}')
        shell: python
        env:
          INPUT_COMMAND: ${{ github.event.inputs.command || 'full' }}
          START_DATE: '2020-01-01'
          END_DATE: '2024-12-31'
