name: Ecommerce Data Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: '要运行的命令 (full/pipeline/cpi)'
        required: true
        default: 'pipeline'
        type: choice
        options:
          - full
          - pipeline
          - cpi

jobs:
  run-pipeline:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: cmd

      - name: 写入 config.ini（从 GitHub Secrets）
        run: |
          import os
          os.makedirs('env', exist_ok=True)
          with open('env/config.ini', 'w', encoding='utf-8') as f:
              f.write(os.environ['CONFIG_INI'])
        shell: python
        env:
          CONFIG_INI: ${{ secrets.CONFIG_INI }}

      - name: 测试连接
        run: python run.py test
        shell: cmd

      - name: 运行指定命令
        run: |
          if "${{ github.event.inputs.command }}"=="pipeline" (
            python run.py pipeline --start 2020-01-01 --end 2024-12-31
          ) else if "${{ github.event.inputs.command }}"=="cpi" (
            python run.py cpi --start 2020-01-01 --end 2024-12-31 --force
          ) else (
            python run.py full --start 2020-01-01 --end 2024-12-31
          )
        shell: cmd
