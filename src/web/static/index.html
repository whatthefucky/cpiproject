<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商 CPI 趋势分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-page: #FFF8F0;
            --bg-card: #FFFFFF;
            --bg-sidebar: #F5EBE0;
            --bg-sidebar-header: #8B6914;
            --bg-hover: #EDE0D4;
            --bg-active: #E1D0BD;
            --text-primary: #4A3728;
            --text-secondary: #7A6A5A;
            --text-light: #A09080;
            --border: #D4C4A8;
            --accent: #8B6914;
            --accent-light: #C49A3C;
            --accent-dark: #6B4F0F;
            --danger: #C0392B;
            --success: #27AE60;
            --shadow: 0 2px 12px rgba(139, 105, 20, 0.08);
            --shadow-hover: 0 4px 20px rgba(139, 105, 20, 0.14);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", Roboto, "Noto Sans SC", sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 300px; min-width: 300px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 20px 18px;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            color: #FFF8F0;
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 18px; font-weight: 700;
            letter-spacing: 0.5px;
        }
        .sidebar-header p {
            font-size: 12px; opacity: 0.85;
            margin-top: 4px;
        }

        .tree-container {
            flex: 1; overflow-y: auto; padding: 6px 0;
        }
        .tree-container::-webkit-scrollbar {
            width: 4px;
        }
        .tree-container::-webkit-scrollbar-thumb {
            background: var(--border); border-radius: 2px;
        }

        .tree-all-item {
            display: flex; align-items: center;
            padding: 8px 16px; margin: 2px 8px;
            font-size: 14px; font-weight: 600;
            cursor: pointer; border-radius: var(--radius-sm);
            color: var(--text-primary);
            transition: all 0.15s;
        }
        .tree-all-item:hover { background: var(--bg-hover); }
        .tree-all-item.active {
            background: var(--accent); color: #FFF8F0;
        }

        .tree-node { cursor: pointer; user-select: none; }
        .tree-node-content {
            display: flex; align-items: center;
            padding: 6px 16px; margin: 1px 8px;
            font-size: 13px; border-radius: var(--radius-sm);
            border-left: 3px solid transparent;
            transition: all 0.15s;
        }
        .tree-node-content:hover { background: var(--bg-hover); }
        .tree-node-content.active {
            background: var(--bg-active);
            border-left-color: var(--accent);
            font-weight: 600;
        }
        .tree-toggle {
            width: 18px; height: 18px;
            display: flex; align-items: center;
            justify-content: center; margin-right: 6px;
            font-size: 10px; color: var(--text-light);
            flex-shrink: 0; transition: transform 0.2s;
        }
        .tree-toggle.open { transform: rotate(90deg); }
        .tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tree-badge {
            font-size: 10px; background: rgba(139, 105, 20, 0.12);
            color: var(--accent); padding: 1px 6px;
            border-radius: 8px; margin-left: 6px;
        }
        .tree-level-1 { font-weight: 500; }
        .tree-level-2 { padding-left: 36px !important; font-size: 12.5px; }
        .tree-level-3 { padding-left: 56px !important; font-size: 12px; color: var(--text-secondary); }
        .tree-children { display: none; }
        .tree-children.open { display: block; }

        /* ===== Main Content ===== */
        .main {
            flex: 1; display: flex; flex-direction: column;
            padding: 24px 28px; overflow: auto;
            min-width: 0;
        }
        .main::-webkit-scrollbar { width: 4px; }
        .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ===== Dashboard Cards ===== */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .dash-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .dash-card .label {
            font-size: 11px; color: var(--text-light);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .dash-card .value {
            font-size: 20px; font-weight: 700;
            color: var(--text-primary);
        }
        .dash-card .sub {
            font-size: 11px; color: var(--text-secondary);
            margin-top: 2px;
        }
        .dash-card .trend-up { color: var(--danger); }
        .dash-card .trend-down { color: var(--success); }

        /* ===== Controls ===== */
        .controls {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px; flex-wrap: wrap;
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .controls label {
            font-size: 12px; color: var(--text-secondary);
            white-space: nowrap;
        }
        .controls input[type="date"] {
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
        }
        .controls input[type="date"]:focus {
            border-color: var(--accent-light);
        }
        .controls .btn {
            padding: 6px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px; font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #FFF8F0;
        }
        .controls .btn-primary:hover {
            box-shadow: 0 2px 8px rgba(139, 105, 20, 0.3);
            transform: translateY(-1px);
        }
        .controls .btn-secondary {
            background: var(--bg-sidebar);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .controls .btn-secondary:hover {
            background: var(--bg-hover);
        }
        .controls .granularity-badge {
            font-size: 11px; color: var(--accent);
            background: rgba(139, 105, 20, 0.1);
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: auto;
        }

        /* ===== Chart Title ===== */
        .header-info {
            margin-bottom: 14px;
        }
        .header-info h1 {
            font-size: 18px; font-weight: 700;
            color: var(--text-primary);
        }
        .header-info .meta {
            font-size: 12px; color: var(--text-light);
            margin-top: 3px;
        }
        .header-info .meta span {
            margin-right: 20px;
        }

        /* ===== Chart ===== */
        .chart-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            flex: 1;
            position: relative;
            min-height: 300px;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .chart-container.has-data canvas { display: block; }
        .chart-container.has-data .empty-state { display: none; }
        .chart-container.no-data canvas { display: none; }
        .chart-container.no-data .empty-state { display: flex; }

        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 248, 240, 0.7);
            font-size: 13px; color: var(--text-light);
            border-radius: var(--radius);
            z-index: 10;
        }
        .loading-overlay.hidden { display: none; }
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-light);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
        .empty-state p { font-size: 14px; color: var(--text-secondary); }
        .empty-state .hint { font-size: 12px; color: var(--text-light); margin-top: 4px; }

        /* ===== Legend ===== */
        .legend-info {
            margin-top: 14px;
            display: flex; gap: 20px; flex-wrap: wrap;
            background: var(--bg-card);
            padding: 12px 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .legend-item {
            font-size: 12px; color: var(--text-secondary);
        }
        .legend-item strong {
            color: var(--text-primary);
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .sidebar { width: 0; min-width: 0; display: none; }
            .main { padding: 16px; }
            .dashboard { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; align-items: stretch; }
            .controls .granularity-badge { margin-left: 0; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>类目导航</h2>
            <p>选择叶子/二级类目查看 CPI</p>
        </div>
        <div class="tree-container" id="treeContainer">
            <div class="loading-overlay" style="position:relative;transform:none;background:transparent">
                <div class="spinner"></div>加载中...
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <!-- Dashboard -->
        <div class="dashboard" id="dashboardCards">
            <div class="dash-card">
                <div class="label">当期指数</div>
                <div class="value" id="dashCurrent">-</div>
                <div class="sub" id="dashCurrentDate"></div>
            </div>
            <div class="dash-card">
                <div class="label">基期指数</div>
                <div class="value" id="dashBase">-</div>
                <div class="sub" id="dashBaseDate"></div>
            </div>
            <div class="dash-card">
                <div class="label">总变化</div>
                <div class="value" id="dashChange">-</div>
                <div class="sub" id="dashChangeLabel"></div>
            </div>
            <div class="dash-card">
                <div class="label">产品数</div>
                <div class="value" id="dashProducts">-</div>
                <div class="sub" id="dashPeriods"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <label>基期:</label>
            <input type="date" id="baseDate" value="2020-01-01">
            <label>开始:</label>
            <input type="date" id="startDate">
            <label>结束:</label>
            <input type="date" id="endDate">
            <button class="btn btn-primary" onclick="loadCPI()">查询</button>
            <button class="btn btn-secondary" onclick="resetView()">重置</button>
            <span class="granularity-badge" id="granularityLabel">粒度: 日</span>
        </div>

        <!-- Chart Title -->
        <div class="header-info">
            <h1 id="chartTitle">总体 CPI 趋势</h1>
            <div class="meta">
                <span id="metaProducts">产品数: -</span>
                <span id="metaDates">周期数: -</span>
            </div>
        </div>

        <!-- Chart -->
        <div class="chart-container">
            <canvas id="cpiChart"></canvas>
            <div class="loading-overlay hidden" id="loadingIndicator">
                <div class="spinner"></div>加载数据中...
            </div>
            <div class="empty-state hidden" id="emptyState">
                <div class="icon">📊</div>
                <p>暂无数据</p>
                <div class="hint">请调整查询范围，或选择其他类目</div>
            </div>
        </div>

        <!-- Legend -->
        <div class="legend-info" id="legendInfo"></div>
    </div>

    <script>
        let cpiChart = null;
        let categoryTree = [];
        let currentNode = null;

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', async () => {
            // 先获取实际数据范围
            await loadDataRange();
            await loadTree();
            loadCPI();
        });

        // ===== 获取数据范围 =====
        let dataRange = { min_date: '2020-01-01', max_date: '2020-01-31' };
        async function loadDataRange() {
            try {
                const res = await fetch('/api/info');
                const info = await res.json();
                if (info.cpi_trend.min_date && info.cpi_trend.max_date) {
                    dataRange.min_date = info.cpi_trend.min_date;
                    dataRange.max_date = info.cpi_trend.max_date;
                }
                document.getElementById('baseDate').value = dataRange.min_date;
                document.getElementById('startDate').value = dataRange.min_date;
                document.getElementById('endDate').value = dataRange.max_date;
                // 更新期间描述
                document.querySelector('.sidebar-header p').textContent =
                    `数据范围: ${dataRange.min_date} ~ ${dataRange.max_date}`;
            } catch (e) {
                console.warn('无法获取数据范围，使用默认值', e);
            }
        }

        // ===== 分类树 =====
        async function loadTree() {
            try {
                const res = await fetch('/api/categories');
                categoryTree = await res.json();
                renderTree(categoryTree);
            } catch (e) {
                document.getElementById('treeContainer').innerHTML =
                    '<div style="padding:20px;color:#C0392B">加载失败: ' + e.message + '</div>';
            }
        }

        function renderTree(items) {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';

            const children = {null: []};
            const nameMap = {};
            items.forEach(item => {
                nameMap[item.id] = item.name;
                const p = item.parent || 'null';
                if (!children[p]) children[p] = [];
                children[p].push(item);
            });

            // "全部" 按钮
            const allDiv = document.createElement('div');
            allDiv.className = 'tree-all-item active';
            allDiv.textContent = '全部类目';
            allDiv.addEventListener('click', () => {
                document.querySelectorAll('.tree-all-item, .tree-node-content').forEach(el => el.classList.remove('active'));
                allDiv.classList.add('active');
                currentNode = null;
                document.getElementById('chartTitle').textContent = '总体 CPI 趋势';
                loadCPI();
            });
            container.appendChild(allDiv);

            const roots = items.filter(i => i.level === 1);
            roots.sort((a, b) => a.id - b.id);
            roots.forEach(root => buildTreeNode(container, root, children, nameMap, 0));
        }

        function buildTreeNode(parentEl, node, children, nameMap, depth) {
            const hasChildren = children[node.id] && children[node.id].length > 0;
            const div = document.createElement('div');
            div.className = 'tree-node';

            const content = document.createElement('div');
            content.className = `tree-node-content tree-level-${node.level}`;
            content.dataset.id = node.id;
            content.dataset.level = node.level;

            const toggle = document.createElement('span');
            toggle.className = 'tree-toggle';
            toggle.textContent = '▶';
            toggle.style.visibility = hasChildren ? 'visible' : 'hidden';
            content.appendChild(toggle);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'tree-name';
            nameSpan.textContent = node.name;
            content.appendChild(nameSpan);

            if (node.level) {
                const badge = document.createElement('span');
                badge.className = 'tree-badge';
                badge.textContent = `L${node.level}`;
                content.appendChild(badge);
            }

            content.addEventListener('click', (e) => {
                e.stopPropagation();
                if (hasChildren) {
                    const childDiv = div.querySelector('.tree-children');
                    if (childDiv) {
                        childDiv.classList.toggle('open');
                        toggle.classList.toggle('open');
                    }
                }
                if (node.level >= 1) {
                    selectNode(node.id, node.name, node.level);
                    // 展开子节点
                    const childDiv = div.querySelector('.tree-children');
                    if (childDiv) {
                        childDiv.classList.add('open');
                        toggle.classList.add('open');
                    }
                }
            });

            div.appendChild(content);

            if (hasChildren) {
                const childDiv = document.createElement('div');
                childDiv.className = 'tree-children';
                children[node.id].sort((a, b) => a.id - b.id);
                children[node.id].forEach(child => {
                    buildTreeNode(childDiv, child, children, nameMap, depth + 1);
                });
                div.appendChild(childDiv);
            }

            parentEl.appendChild(div);
        }

        function selectNode(id, name, level) {
            document.querySelectorAll('.tree-all-item, .tree-node-content').forEach(el => el.classList.remove('active'));
            const el = document.querySelector(`.tree-node-content[data-id="${id}"]`);
            if (el) el.classList.add('active');
            currentNode = { id, name, level };

            const label =
                level === 1 ? `一级类目` :
                level === 2 ? `二级类目` : `细分类目`;
            document.getElementById('chartTitle').textContent = `${label}：${name} CPI 趋势`;
            loadCPI();
        }

        // ===== 加载 CPI 数据 =====
        async function loadCPI() {
            const base = document.getElementById('baseDate').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const loading = document.getElementById('loadingIndicator');
            const container = document.querySelector('.chart-container');
            container.classList.add('loading');
            container.classList.remove('has-data', 'no-data');
            loading.classList.remove('hidden');

            let url = `/api/cpi_trend?base=${base}&start=${start}&end=${end}`;
            if (currentNode) {
                url += `&category_id=${currentNode.id}`;
            }

            try {
                const res = await fetch(url);
                const result = await res.json();
                loading.classList.add('hidden');
                container.classList.remove('loading');

                const granularityMap = {day: '日', week: '周', month: '月'};
                document.getElementById('granularityLabel').textContent =
                    `粒度: ${granularityMap[result.granularity] || result.granularity}`;

                if (result.data && result.data.length > 0) {
                    container.classList.add('has-data');
                    renderChart(result.data, result.granularity);
                    renderLegend(result.data);
                    renderDashboard(result.data);
                    document.getElementById('metaProducts').textContent =
                        `产品数: ${result.data[0].product_count}`;
                    document.getElementById('metaDates').textContent =
                        `周期数: ${result.data.length}`;
                } else {
                    container.classList.add('no-data');
                    if (cpiChart) cpiChart.destroy();
                    cpiChart = null;
                    document.getElementById('legendInfo').innerHTML = '';
                    document.getElementById('metaProducts').textContent = '产品数: -';
                    document.getElementById('metaDates').textContent = '周期数: 0';
                }
            } catch (e) {
                loading.classList.add('hidden');
                container.classList.remove('loading');
                container.classList.add('no-data');
                alert('加载失败: ' + e.message);
            }
        }

        // ===== 渲染图表 =====
        function renderChart(data, granularity) {
            const ctx = document.getElementById('cpiChart').getContext('2d');
            if (cpiChart) cpiChart.destroy();

            if (!data || data.length === 0) return;

            const labels = data.map(d => d.date.slice(0, 10));
            const baseValue = data[0].fisher * 100;
            const fisherValues = data.map(d => +(d.fisher * 100).toFixed(4));
            const laspeyresValues = data.map(d => d.laspeyres ? +(d.laspeyres * 100).toFixed(4) : null);
            const paascheValues = data.map(d => d.paasche ? +(d.paasche * 100).toFixed(4) : null);

            // 棕白色系的颜色
            const colors = {
                fisher: '#8B6914',
                fisherFill: 'rgba(139, 105, 20, 0.08)',
                laspeyres: '#C47E3B',
                paasche: '#A0522D',
            };

            cpiChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '费雪指数',
                            data: fisherValues,
                            borderColor: colors.fisher,
                            backgroundColor: colors.fisherFill,
                            fill: true,
                            tension: 0.3,
                            pointRadius: granularity === 'month' ? 3 : granularity === 'week' ? 2 : 1.5,
                            pointBackgroundColor: colors.fisher,
                            pointHoverRadius: 5,
                            borderWidth: 2.5,
                        },
                        {
                            label: '拉氏指数',
                            data: laspeyresValues,
                            borderColor: colors.laspeyres,
                            backgroundColor: 'transparent',
                            borderDash: [6, 4],
                            tension: 0.3,
                            pointRadius: 1,
                            borderWidth: 1.5,
                        },
                        {
                            label: '帕氏指数',
                            data: paascheValues,
                            borderColor: colors.paasche,
                            backgroundColor: 'transparent',
                            borderDash: [3, 3],
                            tension: 0.3,
                            pointRadius: 1,
                            borderWidth: 1.5,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                boxWidth: 16,
                                padding: 16,
                                font: { size: 12 },
                                color: '#4A3728',
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(74, 55, 40, 0.95)',
                            titleFont: { size: 12 },
                            bodyFont: { size: 12 },
                            padding: 10,
                            cornerRadius: 8,
                            callbacks: {
                                label: function(ctx) {
                                    return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(4);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: {
                                maxTicksLimit: 20,
                                maxRotation: 45,
                                font: { size: 11 },
                                color: '#7A6A5A',
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '指数值 (基期=100)',
                                font: { size: 12 },
                                color: '#7A6A5A',
                            },
                            grid: {
                                color: 'rgba(139, 105, 20, 0.06)',
                            },
                            ticks: {
                                callback: val => val.toFixed(2),
                                font: { size: 11 },
                                color: '#7A6A5A',
                            }
                        }
                    }
                }
            });
        }

        // ===== Dashboard =====
        function renderDashboard(data) {
            if (!data || data.length === 0) return;
            const first = data[0];
            const last = data[data.length - 1];
            const change = ((last.fisher - first.fisher) / first.fisher * 100);

            document.getElementById('dashCurrent').textContent = (last.fisher * 100).toFixed(4);
            document.getElementById('dashCurrentDate').textContent = '截至 ' + last.date.slice(0, 10);

            document.getElementById('dashBase').textContent = (first.fisher * 100).toFixed(4);
            document.getElementById('dashBaseDate').textContent = '基期 ' + first.date.slice(0, 10);

            const changeEl = document.getElementById('dashChange');
            changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(4) + '%';
            changeEl.className = 'value ' + (change > 0 ? 'trend-up' : change < 0 ? 'trend-down' : '');

            document.getElementById('dashChangeLabel').textContent =
                change > 0 ? '📈 上涨' : change < 0 ? '📉 下跌' : '➡️ 持平';

            document.getElementById('dashProducts').textContent = data[0].product_count;
            document.getElementById('dashPeriods').textContent = data.length + ' 个周期';
        }

        // ===== Legend =====
        function renderLegend(data) {
            const el = document.getElementById('legendInfo');
            if (!data || data.length === 0) {
                el.innerHTML = '';
                return;
            }
            const first = data[0];
            const last = data[data.length - 1];
            const change = ((last.fisher - first.fisher) / first.fisher * 100).toFixed(4);
            const trend = change > 0 ? '📈 上涨' : change < 0 ? '📉 下跌' : '➡️ 持平';

            el.innerHTML = `
                <div class="legend-item"><strong>基期指数</strong>: ${(first.fisher * 100).toFixed(4)}</div>
                <div class="legend-item"><strong>末期指数</strong>: ${(last.fisher * 100).toFixed(4)}</div>
                <div class="legend-item"><strong>变化</strong>: ${change}% (${trend})</div>
                <div class="legend-item"><strong>跨度</strong>: ${data[0].date.slice(0,10)} ~ ${data[data.length-1].date.slice(0,10)}</div>
            `;
        }

        // ===== 重置 =====
        function resetView() {
            currentNode = null;
            document.querySelectorAll('.tree-all-item, .tree-node-content').forEach(el => el.classList.remove('active'));
            document.querySelector('.tree-all-item')?.classList.add('active');
            document.getElementById('chartTitle').textContent = '总体 CPI 趋势';
            loadCPI();
        }

        document.querySelectorAll('.controls input').forEach(el => {
            el.addEventListener('keyup', e => { if (e.key === 'Enter') loadCPI(); });
        });
    </script>
</body>
</html>
